name: Materialize Stage1B2 diagnosis suite

on:
  push:
    branches:
      - convgru-role-decoupling

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: convgru-role-decoupling
      - name: Decode diagnostic suite source
        shell: bash
        run: |
          cat .github/tmp/stage1b2_payload_1.txt .github/tmp/stage1b2_payload_2.txt .github/tmp/stage1b2_payload_3.txt .github/tmp/stage1b2_payload_4.txt .github/tmp/stage1b2_payload_5.txt > /tmp/stage1b2_suite.b85
          python - <<'PY'
          import base64, zlib
          from pathlib import Path
          payload = Path('/tmp/stage1b2_suite.b85').read_text().strip().encode()
          source = zlib.decompress(base64.b85decode(payload))
          Path('run_stage1b2_failure_diagnosis_suite.py').write_bytes(source)
          PY
          python -m py_compile run_stage1b2_failure_diagnosis_suite.py
      - name: Commit generated source
        shell: bash
        run: |
          git config user.name "chatgpt-github-connector"
          git config user.email "actions@users.noreply.github.com"
          git add run_stage1b2_failure_diagnosis_suite.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add Stage 1B-2 failure diagnosis suite"
          git push origin HEAD:convgru-role-decoupling
