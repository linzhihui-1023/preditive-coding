name: Materialize Stage1B diagnostics

on:
  push:
    branches:
      - convgru-role-decoupling
    paths:
      - .github/workflows/materialize-stage1b-diagnostics.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: convgru-role-decoupling
      - name: Materialize exact diagnostic source
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, pathlib
          payload = """"""
          source = gzip.decompress(base64.b64decode(payload))
          target = pathlib.Path("run_c_v2_stage1b_failure_diagnostics.py")
          target.write_bytes(source)
          print(f"materialized {target} ({len(source)} bytes)")
          PY
      - name: Commit diagnostic script
        shell: bash
        run: |
          git config user.name "chatgpt-github-connector"
          git config user.email "actions@users.noreply.github.com"
          git add run_c_v2_stage1b_failure_diagnostics.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add Stage 1B failure diagnostic runner"
          git push origin HEAD:convgru-role-decoupling
